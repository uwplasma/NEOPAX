# Full w-He Radau transport run using the frozen full transport-state
# quadratic realtime-NTX response and the transport-scaled endpoint Newton
# criterion. All 52 face anchors are retained.

[general]
mode = "transport"

[geometry]
vmec_file = "./examples/inputs/wout_QI_nfp2_newNT_opt_hires.nc"
boozer_file = "./examples/inputs/boozermn_wout_QI_nfp2_newNT_opt_hires.nc"
n_radial = 51

[neoclassical]
flux_model = "ntx_exact_lij_runtime"
entropy_model = "ntx_exact_lij_runtime"
ntx_exact_n_theta = 5
ntx_exact_n_zeta = 25
ntx_exact_n_xi = 31
ntx_exact_surface_backend = "vmec"
ntx_exact_center_response_mode = "center_local_response"
ntx_exact_response_anchor_count = 52
lagged_response_taylor_order = 2
ntx_exact_full_state_quadratic_response = true

[ambipolarity]
er_ambipolar_method = "two_stage"
er_ambipolar_scan_min = -50.0
er_ambipolar_scan_max = 50.0
er_ambipolar_n_coarse = 80
er_ambipolar_n_refine = 8
er_ambipolar_max_roots = 3
er_ambipolar_tol = 1.0e-6
er_ambipolar_x_tol = 1.0e-6
er_ambipolar_maxiter = 12
er_ambipolar_blocksize = 1
er_ambipolar_scan_batch_mode = "vmap"
er_ambipolar_scan_batch_size = 20
er_ambipolar_overlay_reference_er = true
er_ambipolar_reference_er_file = "./examples/inputs/NTSS_Test_Initial_scaled_flux.h5"
er_ambipolar_reference_er_label = "reference Er"
er_ambipolar_plot = true
er_ambipolar_output_dir = "./outputs/my_ambipolarity_run_scaled_flux_ntx_exact_lagged"
er_initialization_preprocess_boundary_state = false

[turbulence]
flux_model = "turbulent_power_analytical"
chi_density = [6.5e-05, 6.5e-05, 6.5e-05]
chi_temperature = [0.0065, 0.0065, 0.0065]

[classical]
flux_model = "none"

[energy_grid]
n_x = 4

[species]
n_species = 3
names = ["e", "D", "T"]
mass_mp = [0.000544617, 2.0, 3.0]
charge_qp = [-1.0, 1.0, 1.0]

[profiles]
model = "standard_analytical"
n0 = 4.21
n_edge = 0.6
T0 = 17.8
T_edge = 0.7
c_density = [1.0, 0.5, 0.5]
c_temperature = [1.0, 1.0, 1.0]
density_shape_power = 10.0
temperature_shape_power = 2.0
n_scale = [0.65, 0.65, 0.65]
T_scale = 0.7
er_initialization_mode = "ambipolar_min_entropy"
er0_scale = 100.0
er0_peak_rho = 0.8

[boundary.density.left]
type = "neumann"

[boundary.density.left.gradient]
default = 0.0

[boundary.density.right]
type = "dirichlet"

[boundary.density.right.value]
e = 0.39
D = 0.195
T = 0.195

[boundary.temperature.left]
type = "neumann"

[boundary.temperature.left.gradient]
default = 0.0

[boundary.temperature.right]
type = "robin"

[boundary.temperature.right.value]
default = 1.0

[boundary.temperature.right.decay_length]
default = 0.05

[boundary.Er.left]
type = "dirichlet"
value = 0.0

[boundary.Er.right]
type = "floating_ambipolar_edge_node"
[equations]
toggle_density = [false, false, false]
toggle_temperature = [true, true, true]
toggle_Er = true

[sources]
temperature = ["power_exchange", "dt_reaction", "fusion_power_fraction_electrons", "bremsstrahlung_radiation"]

[sources.parameters.power_exchange]
mode = "all"
coulomb_log_mode = "ntssfusion"

[sources.parameters.bremsstrahlung_radiation]
coefficient_mode = "ntssfusion"
delta_zeff = 0.0
[transport_solver]
density_floor = 1.0e-6
temperature_floor = 1.0e-6
transport_solver_backend = "radau"
integrator = "radau"
center_flux_mode = "direct"
radau_rhs_mode = "lagged_response"
radau_num_stages = 7
nonlinear_solver_tol = 1.0e-7
nonlinear_solver_maxiter = 20
radau_newton_tol_mode = "hairer_transport_endpoint"
radau_newton_fnewt_mode = "hairer"
radau_newton_transport_endpoint_tol = 1.0e-1
radau_newton_stagnation_mode = "off"
radau_lagged_jacobian_refresh_mode = "quadratic_exact_retry_after_failure"
radau_lagged_jacobian_refresh_threshold = 1.0
radau_error_estimator = "embedded2_ntss_transport_scale"
radau_controller_mode = "hairer_lean_transport_discounted"
radau_predictor_mode = "collocation_transport_weighted"
lagged_response_reuse_mode = "retry_only"
lagged_response_reuse_rtol = 1.0e-2
lagged_response_reuse_atol = 1.0e-8

t0 = 0.0
t_final = 2.0
dt = 1.0e-8
rtol = 1.0e-6
atol = 1.0e-8
max_step = 1.0
min_step = 1.0e-14
max_steps = 20000
throw = false
debug_stage_markers = true
debug_walltime_attempts = true
debug_nonfinite_rhs_components = false
radau_debug_stage_state_trace = true
radau_debug_node_edge_live_probe_jacobian_threshold = 1.0e5
debug_disable_jit = false
forward_warm_timing_repeats = 0
save_n = 10
temperature_include_work_term = true
temperature_include_neo_convection = true
temperature_include_turbulent_convection = false
temperature_include_classical_convection = false
work_source_mode = "local"
Er_relax = 0.1
DEr = 2.0
Er_permittivity_mode = "ntss_like_midpoint"

[equations]
toggle_density = [false, false, false]
toggle_temperature = [true, true, true]
toggle_Er = true

[sources]
temperature = ["power_exchange", "dt_reaction", "fusion_power_fraction_electrons", "bremsstrahlung_radiation"]

[sources.parameters.power_exchange]
mode = "all"
coulomb_log_mode = "ntssfusion"

[sources.parameters.bremsstrahlung_radiation]
coefficient_mode = "ntssfusion"
delta_zeff = 0.0
