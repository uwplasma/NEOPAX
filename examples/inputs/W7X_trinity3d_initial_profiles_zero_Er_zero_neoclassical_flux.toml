# Benchmark-style NEOPAX input using the W7-X geometry files added in
# examples/inputs, with initial profiles matched to the Trinity3D W7-X example.
# This file is configured for direct flux evaluation with Er initialized to zero
# and all transport flux models disabled, so the neoclassical flux is exactly zero.

[general]
mode = "fluxes"

[geometry]
vmec_file = "./examples/inputs/wout_w7x.nc"
boozer_file = "./examples/inputs/boozmn_w7x.nc"
n_radial = 51

[neoclassical]
flux_model = "none"
entropy_model = "none"

[turbulence]
flux_model = "none"

[classical]
flux_model = "none"

[energy_grid]
n_x = 4

[species]
n_species = 2
names = ["e", "H"]
mass_mp = [0.000544617, 1.0]
charge_qp = [-1.0, 1.0]

[profiles]
model = "prescribed"

