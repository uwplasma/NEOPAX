# Transport-style NEOPAX input using W7-X geometry and Trinity3D-like initial
# profiles, but with an analytic ReLU turbulence model instead of file fluxes.
# This mirrors the local T3D W7-X ReLU regression setup:
# - densities fixed
# - ion temperature evolved
# - electron temperature fixed
# - no neoclassical/classical fluxes
# - implicit theta/Newton time stepping

[general]
mode = "transport"

[geometry]
vmec_file = "./examples/inputs/wout_w7x.nc"
boozer_file = "./examples/inputs/boozmn_w7x.nc"
n_radial = 9
rho_edge = 0.7

[neoclassical]
flux_model = "none"
entropy_model = "none"

[turbulence]
flux_model = "turbulent_relu_analytical"
density_relu_flux = {critical_gradient = [100.0, 100.0], slope = [0.0, 0.0]}
pressure_relu_flux = {critical_gradient = [100.0, 0.1], slope = [0.0, 1.2]}
power = 1.0

[classical]
flux_model = "none"

[energy_grid]
n_x = 4

[species]
n_species = 2
names = ["e", "ion"]
mass_mp = [0.000544617, 1.0]
charge_qp = [-1.0, 1.0]

[profiles]
model = "standard_analytical"
n0 = [0.35, 0.35]
n_edge = [0.29, 0.29]
T0 = [6.7, 1.0]
T_edge = [0.8, 0.8]
density_shape_power = [2.0, 2.0]
density_shape_alpha = [1.0, 1.0]
temperature_shape_power = [2.0, 2.0]
temperature_shape_alpha = [2.0, 1.0]
er_initialization_mode = "analytical"
er0_scale = 0.0
er0_peak_rho = 0.8

[boundary.density.left]
type = "neumann"

[boundary.density.left.gradient]
default = 0.0

[boundary.density.right]
type = "dirichlet"

[boundary.density.right.value]
e = 0.29
ion = 0.29

[boundary.temperature.left]
type = "neumann"

[boundary.temperature.left.gradient]
default = 0.0

[boundary.temperature.right]
type = "dirichlet"

[boundary.temperature.right.value]
e = 0.8
ion = 0.8

[boundary.Er.left]
type = "dirichlet"
value = 0.0

[boundary.Er.right]
type = "dirichlet"
value = 0.0

[equations]
toggle_density = [false, false]
toggle_temperature = [false, true]
toggle_Er = false

[sources]
temperature = ["power_exchange_t3d"]
density = []

[sources.parameters.power_exchange_t3d]
mode = "all"
t_ref = 0.037

[transport_solver]
density_floor = 1.0e-3
temperature_floor = 1.0e-3
transport_solver_backend = "theta_newton"
integrator = "theta_newton"
theta_implicit = 1.0
theta_rhs_mode = "black_box"
theta_predictor_mode = "linearized"
theta_controller_mode = "current"
theta_jacobian_reuse_mode = "refresh_each_iteration"
nonlinear_solver_tol = 2.0e-2
nonlinear_solver_maxiter = 3
t0 = 0.0
t_final = 10.0
dt = 0.00001
max_step = 0.1
min_step = 1.0e-14
max_steps = 20000
throw = false
debug_stage_markers = false
debug_disable_jit = false
save_n = 2
temperature_include_work_term = true
temperature_include_neo_convection = true
temperature_include_turbulent_convection = false
temperature_include_classical_convection = false
temperature_convection_reconstruction = "closure_face_flux"
temperature_heat_flux_reconstruction = "closure_face_flux"
Er_source_mode = "ambipolar_local"
work_source_mode = "local"
Er_relax = 0.1
DEr = 2.0
Er_permittivity_mode = "ntss_like_midpoint"

[transport_output]
transport_plot = true
transport_write_hdf5 = true
transport_compare_ambipolarity_residual = false
transport_scan_ambipolarity_residual = false
transport_overlay_reference_er = false
transport_output_dir = "./outputs/w7x_trinity3d_relu_theta"
transport_plot_n_times = 2
