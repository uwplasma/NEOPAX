name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs take `runs-on` from the repository variable CI_RUNS_ON (a JSON runner
# label or label list); unset, they run on ubuntu-latest. Fork pull requests
# always use hosted runners.
jobs:
  lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=examples_old,build

  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12']
    name: Python ${{ matrix.python-version }} Test

    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: false
    - name: Install NEOPAX
      run: |
        uv venv
        uv pip install . pytest pytest-cov pytest-xdist
        if [ -f requirements.txt ]; then uv pip install -r requirements.txt; fi
    - name: Run tests with coverage
      run: |
        uv run pytest -n 3 --cov-branch --cov-report=xml --cov=NEOPAX
    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: uwplasma/NEOPAX
